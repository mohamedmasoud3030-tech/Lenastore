name: Contract diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run contract verifier
        id: verify
        continue-on-error: true
        run: npm run test:contracts > contract.log 2>&1
      - name: Comment diagnostics
        if: ${{ steps.verify.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file contract.log
