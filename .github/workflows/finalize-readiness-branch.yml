name: Finalize readiness branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore final quality workflow and remove temporary diagnostics
        run: |
          cat > .github/workflows/quality.yml <<'YAML'
          name: Quality

          on:
            pull_request:
            push:
              branches: [main]

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              env:
                SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: npm ci
                - name: Verify frontend, RPC and route contracts
                  run: npm run test:contracts
                - run: npm run lint
                - run: npm test
                - name: Run live SQL flow tests when a test database is configured
                  if: ${{ env.SUPABASE_DB_URL != '' }}
                  run: |
                    for file in supabase/tests/*.sql; do
                      echo "Running $file"
                      psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --file "$file"
                    done
                - run: npm run build
                - uses: actions/upload-artifact@v4
                  with:
                    name: vercel-dist
                    path: dist
                    if-no-files-found: error
          YAML

          git rm -f --ignore-unmatch \
            .github/workflows/normalize-currency-source.yml \
            .github/workflows/contract-diagnostics.yml \
            .github/workflows/contract-diagnostics-commit.yml \
            .github/workflows/finalize-readiness-branch.yml \
            scripts/normalize-currency-source.mjs \
            contract-diagnostics.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/quality.yml
          if git diff --cached --quiet; then
            echo "Branch already finalized"
            exit 0
          fi
          git commit -m "Finalize production readiness branch"
          git push origin HEAD:${{ github.head_ref }}
