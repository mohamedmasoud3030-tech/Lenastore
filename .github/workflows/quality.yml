name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize legacy currency fallbacks on this PR
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          node scripts/normalize-currency-source.mjs
          if git diff --quiet; then
            echo "No source normalization required"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "Normalize all currency fallbacks to EGP"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: npm ci
      - name: Verify frontend, RPC and route contracts
        run: npm run test:contracts
      - run: npm run lint
      - run: npm test
      - name: Run live SQL flow tests when a test database is configured
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: |
          for file in supabase/tests/*.sql; do
            echo "Running $file"
            psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --file "$file"
          done
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: vercel-dist
          path: dist
          if-no-files-found: error
