name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Verify frontend, RPC and route contracts
        run: npm run test:contracts
      - run: npm run lint
      - run: npm test
      - name: Run live SQL flow tests when a test database is configured
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: |
          for file in supabase/tests/*.sql; do
            echo "Running $file"
            psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --file "$file"
          done
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: vercel-dist
          path: dist
          if-no-files-found: error
