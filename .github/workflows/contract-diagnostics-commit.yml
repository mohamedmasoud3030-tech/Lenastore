name: Persist contract diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  report:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run verifier and persist output
        run: |
          set +e
          npm run test:contracts > contract-diagnostics.txt 2>&1
          status=$?
          echo "exit_code=$status" >> contract-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contract-diagnostics.txt
          if ! git diff --cached --quiet; then
            git commit -m "Persist contract diagnostics"
            git push origin HEAD:${{ github.head_ref }}
          fi
